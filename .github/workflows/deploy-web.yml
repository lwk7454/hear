name: Deploy Web & App

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/web/**'
      - 'apps/app/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build Web (Landing)
        run: pnpm --filter web build

      - name: Build App (Dashboard)
        run: pnpm --filter app build

      - name: Deploy to Supabase Storage
        run: |
          # Helper to upload directory
          upload_dir() {
            local dir=$1
            local prefix=$2
            find "$dir" -type f | while read -r file; do
              local rel_path=${file#"$dir/"}
              local dest_path="$prefix$rel_path"
              
              # Determine content type
              local content_type="application/octet-stream"
              case "$file" in
                *.html) content_type="text/html" ;;
                *.js) content_type="application/javascript" ;;
                *.css) content_type="text/css" ;;
                *.svg) content_type="image/svg+xml" ;;
                *.png) content_type="image/png" ;;
                *.jpg|*.jpeg) content_type="image/jpeg" ;;
                *.json) content_type="application/json" ;;
              esac

              echo "Uploading $file to $dest_path ($content_type)..."
              curl -X POST "${SUPABASE_URL}/storage/v1/object/web/${dest_path}" \
                -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
                -H "Content-Type: ${content_type}" \
                -H "x-upsert: true" \
                --data-binary "@$file"
            done
          }

          # Upload web to root
          upload_dir "apps/web/out" ""

          # Upload app to /app
          upload_dir "apps/app/out" "app/"
