name: Deploy Server

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/server/**'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - start
          - stop

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: hear/server

jobs:
  build-and-push:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/server/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  manage-pod:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Determine Action
        id: act
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            echo "action=start" >> $GITHUB_OUTPUT
          else
            echo "action=${{ github.event.inputs.action }}" >> $GITHUB_OUTPUT
          fi

      - name: RunPod Pod Management
        if: steps.act.outputs.action != 'deploy'
        run: |
          ACTION="${{ steps.act.outputs.action }}"
          API_KEY="${{ secrets.RUNPOD_API_KEY }}"
          POD_NAME="hear-dev-server"
          
          if [ -z "$API_KEY" ]; then
            echo "Missing RUNPOD_API_KEY secret"
            exit 1
          fi

          echo "🔍 Looking up Pod ID for name: $POD_NAME..."
          
          # Query to find pod ID by name
          QUERY="query { myself { pods { id name } } }"
          RESPONSE=$(curl -s -X POST "https://api.runpod.io/graphql?api_key=${API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"query\": \"$QUERY\"}")
          
          # Extract ID using jq
          POD_ID=$(echo $RESPONSE | jq -r ".data.myself.pods[] | select(.name == \"$POD_NAME\") | .id")

          if [ -z "$POD_ID" ] || [ "$POD_ID" == "null" ]; then
            echo "❌ Pod with name '$POD_NAME' not found."
            exit 1
          fi

          echo "✅ Found Pod ID: $POD_ID"

          # 2. Get Template ID (Needed for recreation)
          QUERY_TEMPLATE="query { myself { podTemplates { id name } } }"
          RES_TEMPLATE=$(curl -s -X POST "https://api.runpod.io/graphql?api_key=${API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"query\": \"$QUERY_TEMPLATE\"}")
          
          TEMPLATE_ID=$(echo $RES_TEMPLATE | jq -r ".data.myself.podTemplates[] | select(.name == \"$POD_NAME\") | .id")

          if [ -z "$TEMPLATE_ID" ] || [ "$TEMPLATE_ID" == "null" ]; then
             echo "❌ Template '$POD_NAME' not found (cannot re-create pod)."
             exit 1
          fi
          echo "✅ Found Template ID: $TEMPLATE_ID"

          # 3. Execute Action
          if [ "$ACTION" == "stop" ]; then
            echo "Stopping (Terminating) pod $POD_ID..."
            curl -X POST "https://api.runpod.io/graphql?api_key=${API_KEY}" \
              -H "Content-Type: application/json" \
              -d '{"query": "mutation { podTerminate(input: { podId: \"'$POD_ID'\" }) }"}'

          elif [ "$ACTION" == "start" ] || [ "$ACTION" == "deploy" ]; then
            echo "🔄 Recreating Pod (Terminate + Deploy)..."
            
            # Terminate existing if any
            if [ ! -z "$POD_ID" ]; then
               curl -s -X POST "https://api.runpod.io/graphql?api_key=${API_KEY}" \
                -H "Content-Type: application/json" \
                -d '{"query": "mutation { podTerminate(input: { podId: \"'$POD_ID'\" }) }"}'
               echo "   - Old pod terminated."
               sleep 5 # Wait brief moment
            fi

            # Deploy New CPU Pod (Using fixed config matching manage_pod.py)
            echo "🚀 Deploying new CPU Pod..."
            DEPLOY_MUTATION="mutation { deployCpuPod(input: { name: \"$POD_NAME\", templateId: \"$TEMPLATE_ID\", instanceId: \"cpu3g-2-8\", containerDiskInGb: 5, cloudType: SECURE, dataCenterId: \"US-NC-2\", ports: \"8000/http\" }) { id } }"
            
            # Escape inner quotes for JSON payload
            DEPLOY_PAYLOAD="{\"query\": \"mutation { deployCpuPod(input: { name: \\\"$POD_NAME\\\", templateId: \\\"$TEMPLATE_ID\\\", instanceId: \\\"cpu3g-2-8\\\", containerDiskInGb: 5, cloudType: SECURE, dataCenterId: \\\"US-NC-2\\\", ports: \\\"8000/http\\\" }) { id } }\"}"

            DEPLOY_RES=$(curl -s -X POST "https://api.runpod.io/graphql?api_key=${API_KEY}" \
              -H "Content-Type: application/json" \
              -d "$DEPLOY_PAYLOAD")

            NEW_ID=$(echo $DEPLOY_RES | jq -r ".data.deployCpuPod.id")
            
            if [ -z "$NEW_ID" ] || [ "$NEW_ID" == "null" ]; then
               echo "❌ Failed to deploy pod. Response: $DEPLOY_RES"
               exit 1
            fi
            echo "✅ Deployed Pod ID: $NEW_ID"
          fi
